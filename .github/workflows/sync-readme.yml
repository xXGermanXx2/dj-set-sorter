name: README automatisch aktualisieren

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: README synchronisieren
        run: python3 sync_readme.py

      - name: README-Änderung zurück ins Repository pushen
        run: |
          if git diff --quiet -- README.md; then
            echo "README ist bereits aktuell."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: README automatisch aktualisieren [skip ci]"
          git push
